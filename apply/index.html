<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DEVELOPED // Mentorship</title>
<meta property="og:title" content="DEVELOPED // Mentorship">
<style>
  :root { --bg:#0b0b0b; --text:#f4f4f4; --muted:#8a8a8a; --accent:#f2e400; --line:#3a3a3a; }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { background:var(--bg); color:var(--text); font-family:"Helvetica Neue",Helvetica,Arial,sans-serif; padding:40px 20px 80px; }
  main { max-width:560px; margin:0 auto; }
  .head { font-weight:800; font-size:15px; letter-spacing:.14em; color:var(--accent); padding-bottom:6px; }
  .head span { color:var(--accent); }
  form { margin-top:8px; }
  .q { padding:16px 0 4px; }
  .q label.t { display:flex; gap:12px; font-size:14px; font-weight:500; margin-bottom:10px; }
  .q label.t i { font-style:normal; color:var(--muted); font-size:12px; padding-top:2px; min-width:18px; }
  .q small { display:block; color:var(--muted); font-size:12px; margin:-4px 0 10px 0; }
  .q > input, .q > select, .q > textarea { margin-left:0; }
  input[type=text], input[type=email], input[type=tel], input[type=url], select, textarea {
    width:100%; background:#F3EEDC; border:1px solid #F3EEDC; color:#0b0b0b; font:inherit; font-size:16px; padding:13px 14px; outline:none; border-radius:0; }
  input:focus, select:focus, textarea:focus { border-color:var(--accent); }
  input::placeholder, textarea::placeholder { color:#9a9a9a; }
  select { appearance:none; cursor:pointer; }
  select option { background:#F3EEDC; color:#0b0b0b; }
  textarea { min-height:84px; resize:vertical; line-height:1.45; }
    .q:focus-within label.t i { color:var(--accent); }
  .checks { padding-left:0; display:flex; flex-direction:column; gap:10px; }
  .checks label { display:flex; align-items:center; gap:10px; font-size:15px; cursor:pointer; }
  .checks input { appearance:none; width:14px; height:14px; border:1px solid var(--text); border-radius:0; cursor:pointer; flex:none; }
  .checks input:checked { background:var(--accent); border-color:var(--accent); }
  .bottom { margin-top:28px; display:flex; flex-direction:column; gap:14px; }
  .note { color:var(--muted); font-size:12px; line-height:1.5; text-align:center; order:2; }
  button { background:var(--accent); color:#0b0b0b; border:0; border-radius:0; padding:16px; width:100%; font:inherit; font-weight:800; letter-spacing:.12em; font-size:14px; cursor:pointer; white-space:nowrap; }
  button:disabled { opacity:.6; cursor:wait; }
  .err { color:#ff6b6b; font-size:12px; margin-top:14px; display:none; }
  .done { display:none; margin-top:40px; font-size:15px; line-height:1.6; }
  .done b { color:var(--accent); font-weight:700; }
  footer { margin-top:60px; font-size:11px; color:var(--muted); letter-spacing:.08em; }
</style>
</head>
<body>
<main>
  <div class="head">DEVELOPED // MENTORSHIP</div>

  <form id="f" novalidate>
    <div class="q"><label class="t" for="name">Name / artist name</label><input id="name" name="name" type="text" required></div>
    <div class="q"><label class="t" for="email">Email</label><input id="email" name="email" type="email" required></div>
    <div class="q"><label class="t" for="phone">Phone</label><input id="phone" name="phone" type="tel" required></div>
    <div class="q"><label class="t" for="instagram">Instagram</label><input id="instagram" name="instagram" type="text" placeholder="@" required></div>
    <div class="q"><label class="t" for="years">How long have you been producing?</label>
      <select id="years" name="years" required>
        <option value="" disabled selected>Select ↓</option>
        <option>Less than 1 year</option><option>1–2 years</option><option>3–5 years</option><option>5+ years</option>
      </select></div>
    <div class="q"><label class="t" for="tracks">Your music</label>
      <small>One link to a private SoundCloud playlist or Dropbox folder with 2–3 tracks</small>
      <input id="tracks" name="tracks" type="url" placeholder="https://" required></div>
    <div class="q"><label class="t" for="now">Where are you at right now, and what's holding you back?</label><textarea id="now" name="now" required></textarea></div>
    <div class="q"><label class="t" for="goal">Where do you want to be in 12 months?</label><textarea id="goal" name="goal" required></textarea></div>
    <div class="q"><label class="t">What are you interested in building?</label>
      <small>Check all that apply</small>
      <div class="checks">
        <label><input type="checkbox" name="building" value="Artist career">Artist career</label>
        <label><input type="checkbox" name="building" value="Starting a label">Starting a label</label>
        <label><input type="checkbox" name="building" value="Events / events company">Events / events company</label>
        <label><input type="checkbox" name="building" value="Not sure yet">Not sure yet</label>
      </div></div>

    <div class="bottom">
      <button id="btn" type="submit">SUBMIT</button>
    </div>
    <p class="err" id="err">Please fill out every field.</p>
  </form>

  <div class="done" id="done"><b>Got it.</b><br>Thanks for applying. If it's a fit, you'll hear from me on Instagram.</div>

</main>
<script>
  const ENDPOINT = "https://script.google.com/macros/s/AKfycbx0tlG0IJF2sCejSK0rkYoU2N0Gzsr1cwiVp2AU4gIYhevhk76Ov76dPZVe7EA-O6Y8kQ/exec";
  const f = document.getElementById('f'), btn = document.getElementById('btn'), err = document.getElementById('err');
  f.addEventListener('submit', async (e) => {
    e.preventDefault();
    const missing = [...f.querySelectorAll('[required]')].some(el => !el.value.trim()) || !f.querySelector('input[name=building]:checked');
    if (missing) { err.style.display = 'block'; return; }
    err.style.display = 'none';
    btn.disabled = true; btn.textContent = 'SENDING...';
    try {
      await fetch(ENDPOINT, { method: 'POST', mode: 'no-cors', body: new URLSearchParams(new FormData(f)) });
      f.style.display = 'none';
      document.getElementById('done').style.display = 'block';
      window.scrollTo(0, 0);
    } catch (x) {
      btn.disabled = false; btn.textContent = 'SUBMIT';
      err.textContent = 'Something went wrong. Try again.'; err.style.display = 'block';
    }
  });
</script>
</body>
</html>

  * { box-sizing:border-box; margin:0; padding:0; }
  body { background:var(--bg); color:var(--text); font-family:"Helvetica Neue",Helvetica,Arial,sans-serif; min-height:100vh; display:flex; align-items:center; justify-content:center; padding:32px 16px; text-align:center; }

  p { color:var(--muted); margin-top:10px; font-size:14px; }
  .links { margin-top:28px; display:flex; flex-direction:column; gap:10px; max-width:320px; margin-left:auto; margin-right:auto; }
  a { display:block; border:1px solid var(--line); border-radius:12px; padding:14px; color:var(--text); text-decoration:none; font-weight:600; }
  a:hover { border-color:var(--accent); }
</style>
</head>
